<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Weather</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="loading-content">
    <div class="loading-icon">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="35" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
        <path d="M50 20 Q65 35 65 50 Q65 65 50 80 Q35 65 35 50 Q35 35 50 20Z" fill="rgba(255,255,255,0.8)"/>
        <circle cx="50" cy="50" r="8" fill="white"/>
      </svg>
    </div>
    <p class="loading-text">Getting your weather</p>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="search-overlay" class="search-overlay hidden">
  <div class="search-container">
    <div class="search-header">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="city-search-input" placeholder="Search for a city or airport" autocomplete="off"/>
        <button id="clear-search" class="clear-btn hidden">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
        </button>
      </div>
      <button id="search-cancel" class="cancel-btn">Cancel</button>
    </div>
    <div id="search-results" class="search-results"></div>
    <div id="saved-cities-section" class="saved-section">
      <h3 class="saved-title">My Cities</h3>
      <div id="saved-cities-list" class="saved-list"></div>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="bg-layer" id="bg-layer"></div>
  <div class="bg-overlay"></div>
  <div id="particles-container" class="particles-container"></div>
  <header class="top-bar">
    <button id="location-btn" class="icon-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </button>
    <div class="city-dots" id="city-dots"></div>
    <button id="open-search-btn" class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </header>
  <div id="pages-container" class="pages-container"></div>
  <div class="page-dots-container" id="page-dots-container"></div>
</div>

<template id="weather-page-template">
  <div class="weather-page">
    <div class="page-scroll">
      <section class="hero-section">
        <p class="city-name" data-field="city"></p>
        <p class="current-temp" data-field="temp"></p>
        <p class="condition-text" data-field="condition"></p>
        <p class="hi-lo-text" data-field="hilo"></p>
      </section>
      <div class="glass-card hourly-card">
        <div class="card-label">
          <svg viewBox="0 0 24 24" fill="currentColor" class="label-icon"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
          HOURLY FORECAST
        </div>
        <div class="hourly-scroll" data-field="hourly"></div>
      </div>
      <div class="glass-card daily-card">
        <div class="card-label">
          <svg viewBox="0 0 24 24" fill="currentColor" class="label-icon"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
          10-DAY FORECAST
        </div>
        <div class="daily-list" data-field="daily"></div>
      </div>
      <div class="info-grid" data-field="info-grid"></div>
      <div class="bottom-spacer"></div>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
